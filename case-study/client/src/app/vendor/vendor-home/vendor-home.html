<mat-card>
  <mat-card-content>
    @if (hasVendorSelected()) {
      <mat-card-title align="center" style="margin: 1rem">
        {{ newVendor() ? 'New Vendor' : 'Vendor Details' }}
      </mat-card-title>
      <app-vendor-details
        [vendor]="vendorInDetail()"
        (saved)="saveVendor($event)"
        (deleted)="deleteVendor($event)"
        (closed)="refresh()"
      />
    } @else {
      <mat-card-title align="center" style="margin: 1rem">Vendors</mat-card-title>
      <mat-list>
        @for (vendor of vendors(); track vendor.id) {
          <mat-list-item (click)="selectVendor(vendor)">
            {{ vendor.id }} - {{ vendor.name }}, {{ vendor.city }} ({{ vendor.type }})
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>

@if (!hasVendorSelected()) {
  <button
    mat-fab
    (click)="addNewVendor()"
    matTooltip="Add New Vendor"
    class="addicon"
    color="primary"
  >
    <mat-icon>control_point</mat-icon>
  </button>
}
