<mat-card>
  @if (hasSelectedExpense()) {
    <mat-card-title align="center" style="margin: 1rem">
      {{ newExpense() ? 'New Expense' : 'Expense Details' }}
    </mat-card-title>
    <mat-card-content>
      <app-expense-details
        [employees]="employees()"
        [expense]="expenseInDetail()"
        (saved)="saveExpense($event)"
        (deleted)="deleteExpense($event)"
        (closed)="refresh()"
      />
    </mat-card-content>
  } @else {
    <mat-card-title align="center" style="margin: 1rem">Expenses</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="expensesTable">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Expense ID</th>
          <td mat-cell *matCellDef="let expense">{{ expense.id }}</td>
        </ng-container>

        <ng-container matColumnDef="employeeId">
          <th mat-header-cell *matHeaderCellDef>Employee</th>
          <td mat-cell *matCellDef="let expense">
            {{ employeeOfId(expense.employeeId)?.lastName ?? 'N/A' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let expense">{{ expenseDate(expense.date) | date: 'MM/dd/yyyy' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="tableColumns; sticky: true"></tr>
        <tr
          mat-row
          *matRowDef="let expense; columns: tableColumns"
          (click)="selectExpense(expense)"
        ></tr>
      </table>
    </mat-card-content>
  }
</mat-card>

@if (!hasSelectedExpense()) {
  <button
    mat-fab
    (click)="addNewExpense()"
    matTooltip="Add New Expense"
    class="addicon add-expense-btn"
    color="primary"
  >
    <mat-icon>control_point</mat-icon>
  </button>
}
